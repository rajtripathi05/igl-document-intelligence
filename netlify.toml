# Netlify configuration for the "indiaglycolsai" site.
#
# IMPORTANT: Netlify serves STATIC files only — it cannot run the Streamlit
# (Python/WebSocket) server that IS this application. This config publishes the
# static landing page (the front door). The actual app must run on a Python host
# (Streamlit Community Cloud or Render — see DEPLOYMENT.md).
#
# Deploy the front door:
#   npm i -g netlify-cli && netlify deploy --prod
# then rename the site to "indiaglycolsai" (→ https://indiaglycolsai.netlify.app).

[build]
  publish = "deploy/netlify-landing"
  command = ""

[build.environment]
  NODE_VERSION = "18"

# OPTIONAL — make the Netlify URL forward straight to the running app. After you
# deploy the app (e.g. https://indiaglycolsai.streamlit.app), uncomment this and
# set `to`, then redeploy. (A plain redirect, because Netlify cannot proxy
# Streamlit's WebSocket connection.)
# [[redirects]]
#   from = "/*"
#   to = "https://indiaglycolsai.streamlit.app"
#   status = 302
#   force = true

# Security headers for the static page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
