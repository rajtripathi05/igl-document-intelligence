# Netlify configuration for the "indiaglycolsai" site.
#
# IMPORTANT: Netlify serves STATIC files only — it cannot run the Streamlit
# (Python/WebSocket) server that IS this application. This config publishes the
# static landing page (the front door). The actual app must run on a Python host
# (Streamlit Community Cloud or Render — see DEPLOYMENT.md).
#
# `base` isolates Netlify to the static folder so it does NOT try to pip-install
# the Python app (which would fail the Netlify build). Everything below is
# relative to that base directory.

[build]
  base = "deploy/netlify-landing"
  publish = "."
  command = ""

# OPTIONAL — make https://indiaglycolsai.netlify.app forward straight to the
# running app. After you deploy the app (e.g. https://indiaglycolsai.streamlit.app
# on Streamlit Cloud, or the Render URL), uncomment this and set `to`, commit,
# and Netlify redeploys. A plain 302 redirect, because Netlify cannot proxy
# Streamlit's live WebSocket connection.
# [[redirects]]
#   from = "/*"
#   to = "https://indiaglycolsai.streamlit.app"
#   status = 302
#   force = true

# Security headers for the static page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
