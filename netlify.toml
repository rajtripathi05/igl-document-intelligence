# Netlify configuration — IGL Document Intelligence, WEB EDITION (no Streamlit).
#
# The site served from `web/` is a static single-page app:
#   - RA Posting runs 100% in the browser (SheetJS + ExcelJS via CDN) —
#     bank statements never leave the user's machine.
#   - Sales Order extraction calls the serverless function `/api/extract`
#     (web/functions/extract.mjs), which forwards the PO to the AI provider.
#
# `base = "web"` keeps Netlify away from the Python/Streamlit app at the repo
# root (it must NOT try to pip-install requirements.txt).
#
# REQUIRED environment variables (Site settings -> Environment variables):
#   AI_API_KEY      the OpenRouter (default) or Gemini API key
# Optional:
#   AI_PROVIDER     openrouter (default) | gemini
#   DEFAULT_MODEL   e.g. google/gemini-flash-latest (openrouter)
#                        gemini-flash-latest        (gemini)

[build]
  base = "web"
  publish = "."
  command = ""

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
